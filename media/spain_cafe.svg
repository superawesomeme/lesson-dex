  <rect x="390" y="500" width="20" height="90" fill="#475569"/>
  <!-- Cups -->
  <rect x="350" y="460" width="30" height="35" rx="4" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <path d="M 380 470 C 390 470 390 485 380 485" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="420" y="460" width="30" height="35" rx="4" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <path d="M 450 470 C 460 470 460 485 450 485" fill="none" stroke="#334155" stroke-width="3"/>
  <text x="400" y="270" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#b45309" text-anchor="middle">Café Central</text>
  <text x="400" y="560" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#64748b" text-anchor="middle">«Hola, ¿de dónde eres?»</text>
</svg>