      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#bg)"/>
  <!-- Canopy / Awning -->
  <path d="M 100 120 L 700 120 L 680 180 L 120 180 Z" fill="#dc2626"/>
  <path d="M 180 120 L 260 120 L 250 180 L 190 180 Z" fill="#ffffff"/>
  <path d="M 340 120 L 420 120 L 410 180 L 350 180 Z" fill="#ffffff"/>
  <path d="M 500 120 L 580 120 L 570 180 L 510 180 Z" fill="#ffffff"/>
  <!-- Cafe Window -->
  <rect x="160" y="200" width="480" height="240" rx="12" fill="#ffffff" stroke="#78350f" stroke-width="8"/>
  <line x1="400" y1="200" x2="400" y2="440" stroke="#78350f" stroke-width="6"/>
  <line x1="160" y1="320" x2="640" y2="320" stroke="#78350f" stroke-width="6"/>
